<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzles | The Moyai Ribbon</title>
    
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <!-- Custom CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="../index.html" class="back-link">← Games</a>
            <h1>Chess Puzzles</h1>
            <div class="score-board hidden" id="score-board">
                Score: <span id="score-val">0</span> | Strikes: <span id="strikes-val">0</span>/3
            </div>
        </header>

        <main class="layout">
            <div class="active-clue-card" id="puzzle-info">
                <button class="clue-nav-btn" id="btn-prev-puzzle" title="Previous Puzzle">‹</button>
                <div class="clue-main-content">
                    <div class="clue-meta">
                        <span class="clue-dir" id="puzzle-rating" style="font-size: 1.4rem;">ELO 1196</span>
                    </div>
                    <div class="puzzle-actions">
                        <button class="action-btn" id="btn-hint">HINT</button>
                        <button class="action-btn" id="btn-solution">SOLUTION</button>
                    </div>
                    <div class="status-msg" id="status-msg"></div>
                </div>
                <button class="clue-nav-btn" id="btn-next-puzzle" title="Next Puzzle">›</button>
            </div>

            <div class="board-area">
                <div id="board-container" style="position: relative; width: 100%; max-width: 500px;">
                    <div id="board" style="width: 100%;"></div>
                    <svg id="arrow-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;"></svg>
                </div>
            </div>
        </main>
    </div>

    <!-- Chess.js and Chessboard.js Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
