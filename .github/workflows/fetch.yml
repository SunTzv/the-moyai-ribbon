name: 🗿🎀

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-puzzles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch Script
        run: python fetch_puzzles.py

      - name: Commit and Push
        run: |
          git config user.name "SunTzv"
          git config user.email "suntzu@ncrypt.net.in"
          git add todays/
          git commit -m "🗿🎀" || exit 0
          git push