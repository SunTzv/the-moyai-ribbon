<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Moyai Ribbon</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <main class="container">
        <header>
            <h1>THE MOYAI RIBBON</h1>
        </header>

        <section class="games-grid">
            <a href="crossword/" class="game-card">
                <div class="game-info">
                    <h2>CROSSWORD</h2>
                    <p>MINI, MIDI, AND DAILY CROSSWORDS UPDATED EVERY DAY.</p>
                </div>
                <div class="game-hover">PLAY NOW ➔</div>
            </a>

            <a href="chess/" class="game-card">
                <div class="game-info">
                    <h2>CHESS PUZZLES</h2>
                    <p>DAILY PUZZLES WITH SURVIVAL RUSH AND PRACTICE MODES.</p>
                </div>
                <div class="game-hover">PLAY NOW ➔</div>
            </a>

            <div class="game-card coming-soon">
                <div class="game-info">
                    <h2>MORE GAMES</h2>
                    <p>COMING SOON.</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
